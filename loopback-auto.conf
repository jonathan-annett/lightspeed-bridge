# PHASE 2 — cable-agnostic. Install as ~/.config/pipewire/pipewire.conf.d/loopback.conf
# (replacing the phase-1 file) once the basic path is proven.
#
# GOAL: plug in whichever capture device is to hand at a venue — the cheap USB-C
# stereo adapter or the mono XLR-to-USB-A cable — and have it Just Work with no
# reconfiguration.
#
# HOW IT WORKS
#   * capture.props has NO target.object, so the stream follows whatever
#     WirePlumber selects as the default audio source.
#   * The capture side is declared as stereo [ FL FR ] with remixing LEFT ENABLED.
#     PipeWire's channelmix then adapts automatically:
#         stereo source -> identity passthrough (FL->FL, FR->FR)
#         mono source   -> upmixed to BOTH FL and FR, so it reaches both ears
#     This is why stream.dont-remix must stay false. Setting it true would break
#     the mono cable.
#   * playback.props DOES target the Logitech base station explicitly, because
#     that device never changes and this avoids the default sink drifting to HDMI.
#
# REQUIRES: 50-disable-a50-mic.conf (WirePlumber), otherwise the base station's own
# headset mic can win the "default source" election and get bridged to the
# headphones instead of your actual input. See that file.
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Audio Bridge"

            capture.props = {
                node.name        = "audio_bridge_capture"
                node.description = "Audio Bridge Capture"
                media.class      = "Stream/Input/Audio"
                # NO target.object — deliberately follows the default source.
                audio.position   = [ FL FR ]
                node.latency     = 64/48000
                # MUST remain false so a mono cable is upmixed to both channels.
                stream.dont-remix = false
                # Correct intent, but NOT SUFFICIENT on its own — verified landing on
                # the node as stream.capture.sink=False while WirePlumber's fallback
                # linking attached the stream to the A50 monitor anyway.
                #
                # ⚠ KNOWN ISSUE — FEEDBACK LOOP WITH NO INPUT PRESENT:
                # With no capture device (booted before patching in, or mid cable-swap)
                # this untargeted capture stream attaches to the A50 sink's MONITOR:
                #   A50 out -> monitor -> bridge capture -> bridge playback -> A50 out
                # Observed live during a cable swap. Silence is the correct behaviour.
                # Unresolved for the untargeted design; explicit per-cable targets do
                # not exhibit it, because an explicit target never falls back.
                stream.capture.sink = false
                node.dont-reconnect = false
                node.passive     = false
            }

            playback.props = {
                node.name        = "audio_bridge_playback"
                node.description = "Audio Bridge Playback"
                media.class      = "Stream/Output/Audio"
                target.object    = "alsa_output.usb-Logitech_A50-00.analog-stereo"
                audio.position   = [ FL FR ]
                node.latency     = 64/48000
                node.dont-reconnect = false
                node.passive     = false
            }
        }
    }
]
