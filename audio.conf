# Install as /etc/security/limits.d/audio.conf
#
# Grants realtime scheduling and unlimited locked memory to the audio group so
# PipeWire can acquire RT priority for glitch-free low-latency operation.
#
# BACKGROUND: the pipewire package ships /etc/security/limits.d/25-pw-rlimits.conf
# which grants the same thing to group @pipewire — but that group ships EMPTY, so
# the file is inert and PipeWire silently falls back to no realtime priority
# ("RTKit does not give us MaxRealtimePriority, using 1"). RTKit is not installed
# either, so there is no fallback. This file targets @audio instead.
#
# Verify after a fresh login with:  ulimit -r   (expect 95)
#                                   ulimit -l   (expect unlimited)
@audio   -   rtprio      95
@audio   -   memlock     unlimited
