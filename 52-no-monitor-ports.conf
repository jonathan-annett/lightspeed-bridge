# Install as ~/.config/wireplumber/wireplumber.conf.d/52-no-monitor-ports.conf
#
# Disables monitor ports on audio nodes.
#
# WHY: with no capture device present (powered up before patching in, or mid
# cable-swap) the loopback's capture stream attaches to the A50 sink's MONITOR,
# creating a feedback loop:
#     A50 out -> monitor -> bridge capture -> bridge playback -> A50 out
#
# Nothing else prevents this:
#   * stream.capture.sink = false — lands on the node but WirePlumber's fallback
#     linking overrides it (verified)
#   * target.object — does not stop fallback either; an absent target just makes the
#     module grab whatever else it can find
#   * node.dont-reconnect = true — DOES block the fallback, but also stops the stream
#     connecting to its CORRECT target at all, so the bridge goes permanently silent
#
# Removing the monitor ports removes the only thing there is to fall back to, so the
# stream simply stays unlinked. Silence is the correct behaviour with no input.
#
# Setting this at runtime with `wpctl settings` is NOT enough — it is lost when the
# node is recreated on device removal, and the monitor ports (and the feedback) come
# straight back. It has to be in the config.
#
# COST: you can no longer record what the A50 is playing (pw-record --target <sink>
# with stream.capture.sink=true). Irrelevant for this appliance; re-enable
# temporarily if you ever need to capture the output for diagnosis.
#
# VERIFY:  pw-link -l | grep -c monitor_     -> want 0, including with no input device
wireplumber.settings = {
    node.features.audio.monitor-ports = false
}
