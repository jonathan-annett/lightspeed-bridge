# Low-latency clock settings for the USB audio bridge.
# 128/48000 = 2.67 ms per period. min-quantum 64 allows PipeWire to go lower
# if a client requests it; raise quantum to 256 if xruns appear.
context.properties = {
    default.clock.quantum     = 64
    default.clock.min-quantum = 64
    default.clock.max-quantum = 1024

    # Both USB devices are natively 48 kHz. Pinning the graph rate here avoids
    # any resampling between capture and playback.
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
}
