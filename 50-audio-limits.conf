# Install as /etc/systemd/system/user@.service.d/50-audio-limits.conf
# Then: sudo systemctl daemon-reload && sudo systemctl restart user@1000.service
#
# WHY THIS IS REQUIRED (and why limits.d/audio.conf is NOT enough)
#
# /etc/security/limits.d/audio.conf is applied by pam_limits, which only runs for
# PAM *login* sessions. It correctly gives an interactive SSH shell rtprio 95.
#
# But PipeWire here runs as a systemd USER SERVICE under user@1000.service, started
# by lingering at boot with no login at all. On Raspberry Pi OS Lite there is no
# /etc/pam.d/systemd-user file whatsoever, so the systemd user manager never passes
# through pam_limits. It inherits the system defaults instead:
#     LimitRTPRIO=0   LimitMEMLOCK=8388608
# and every process under it — including PipeWire's data-loop threads — is stuck at
# SCHED_OTHER with no realtime priority.
#
# The symptom is silent: audio still works, xruns may even stay at zero under light
# load, but there is no scheduling guarantee. Under venue conditions (USB contention,
# CPU spikes) that is exactly when it fails.
#
# Setting the limits on the user manager itself is the fix that actually reaches a
# lingering headless session.
#
# VERIFY with:  ps -eLo pid,tid,cls,rtprio,comm | grep data-loop
#   want: cls=FF (SCHED_FIFO) and a non-zero rtprio, NOT cls=TS
#
# LimitRTTIME is deliberately FINITE. RTKit refuses to leave a thread at realtime
# priority when RLIMIT_RTTIME is unlimited — that is why its grant of priority 20
# did not stick and rtkit-daemon kept reporting "Supervising 0 threads". 200 ms is
# generous against a 2.67 ms quantum, and it means a runaway realtime thread gets
# SIGXCPU rather than wedging the Pi.
[Service]
LimitRTPRIO=95
LimitMEMLOCK=infinity
LimitRTTIME=200000
