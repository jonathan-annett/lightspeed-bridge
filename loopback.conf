# Install as ~/.config/pipewire/pipewire.conf.d/loopback.conf
#
# A SINGLE loopback module, targeted at the primary stereo adapter.
# Requires 52-no-monitor-ports.conf (WirePlumber) — see below.
#
# BEHAVIOUR (all three verified on hardware):
#   stereo adapter plugged in  -> links to it, audio flows
#   stereo absent, other cable -> falls back to whatever capture device IS present,
#                                 so the mono XLR cable works with no config change
#   no capture device at all   -> stays unlinked. SILENCE, which is correct.
#   unplug / replug            -> recovers automatically
#
# WHY A SINGLE MODULE AND NOT ONE PER CABLE
# Two modules with node.dont-reconnect = false both grab the SAME source when only
# one cable is present, and their playback streams SUM into the A50 (~+6 dB).
# A single module's fallback already gives cable-agnostic behaviour for free.
#
# WHY node.dont-reconnect STAYS false
# Setting it true does block wrong-target fallback, but it ALSO stops the stream ever
# connecting to its correct target — the bridge goes permanently silent. Verified:
# zero links even with the target device present. It is not a usable option.
#
# THE FEEDBACK LOOP IS PREVENTED ELSEWHERE
# With no capture device, an untargeted-by-necessity fallback would attach to the A50
# sink's MONITOR:  A50 out -> monitor -> capture -> playback -> A50 out.
# That is stopped by disabling monitor ports entirely in
# ~/.config/wireplumber/wireplumber.conf.d/52-no-monitor-ports.conf.
# Do not remove that file, or this config becomes a feedback generator whenever
# nothing is patched in. stream.capture.sink=false does NOT substitute for it
# (verified: lands on the node, WirePlumber's fallback linking ignores it).
#
# MONO AND STEREO BOTH REACH BOTH EARS
# stream.dont-remix stays false so channelmix passes stereo through as identity and
# duplicates mono to FL+FR. Verified on the mono cable: output L==R at 100.0%, no
# level loss (-6.0 dBFS in -> -4.1 dBFS out).
#
# The C-Media mono cable's noisy factory defaults are already corrected and persisted:
#   AGC off       -> /var/lib/alsa/asound.state
#   gain +4.46 dB -> ~/.local/state/wireplumber/default-routes (was +23.81 dB)

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Audio Bridge"

            capture.props = {
                node.name        = "audio_bridge_capture"
                node.description = "Audio Bridge Capture"
                media.class      = "Stream/Input/Audio"
                target.object    = "alsa_input.usb-Generic_USB_HP_MIC_Adapter-00.analog-stereo"
                audio.position   = [ FL FR ]
                node.latency     = 64/48000
                stream.dont-remix = false
                node.dont-reconnect = false
                node.passive     = false
            }

            playback.props = {
                node.name        = "audio_bridge_playback"
                node.description = "Audio Bridge Playback"
                media.class      = "Stream/Output/Audio"
                target.object    = "alsa_output.usb-Logitech_A50-00.analog-stereo"
                audio.position   = [ FL FR ]
                node.latency     = 64/48000
                node.dont-reconnect = false
                node.passive     = false
            }
        }
    }
]
