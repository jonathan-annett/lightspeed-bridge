# Install as ~/.config/wireplumber/wireplumber.conf.d/53-sink-unity-volume.conf
#
# WHY THIS EXISTS
# The A50 base station has NO hardware volume control, so PipeWire applies a
# SOFTWARE volume to its sink. With no saved route, WirePlumber applies its stock
# default-sink-volume of 0.064 (~ -24 dB) on every boot.
#
# There is a race in the route -> node propagation: when the A50 enumerates after
# WirePlumber is already up (it is USB-powered from the Pi and boots its own
# firmware, so timing varies boot to boot; guaranteed if it is plugged in late),
# the route reports 0.064 but the sink node itself is sometimes left at 1.0.
# Result: some boots are ~24 dB louder than others with nothing touched.
# Reproduced 2026-09-12 by hot-plugging the A50: 1.0 once, 0.064 once.
#
# FIX: make the default 1.0 (unity). Both sides of the race then agree, so the
# output level is identical on every boot regardless of enumeration order.
# Unity was chosen deliberately as the operating level - it gives headroom, and
# the headset's own volume wheel does the attenuation. Input gain is adjusted
# separately (clicker daemon).
#
# VERIFY:  id=$(wpctl status | awk '/A50 Analog Stereo/{gsub(/\./,"",$2); print $2; exit}')
#          pw-cli enum-params $id Props | grep -A3 softVolumes    -> want Float 1.000000
wireplumber.settings = {
    device.routes.default-sink-volume = 1.0
}
