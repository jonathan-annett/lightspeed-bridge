# Install as ~/.config/wireplumber/wireplumber.conf.d/50-disable-a50-mic.conf
#
# WHY THIS EXISTS
# The Logitech Lightspeed base station exposes its own headset microphone as a
# capture source ("A50 Mono", alsa_input.usb-Logitech_A50-00.mono-fallback).
#
# loopback-auto.conf deliberately leaves the capture side untargeted so it follows
# the default source. Without this rule, WirePlumber can elect the base station's
# OWN MIC as that default — silently bridging the headset mic straight back to the
# headphones instead of your actual input device. That failure is easy to miss
# because the link still forms and looks correct in pw-link.
#
# Disabling the node removes it from the election entirely, so whichever capture
# cable is plugged in always wins.
#
# NOTE: this only disables the base station's MIC (Audio/Source). Its PLAYBACK
# side is untouched and remains the bridge's output.
#
# UNVERIFIED: this matching syntax has not yet been tested against WirePlumber
# 0.5.8 on the device. Confirm with `wpctl status` that "A50 Mono" no longer
# appears under Sources, and that the base station is still listed under Sinks.
monitor.alsa.rules = [
    {
        matches = [
            {
                node.name = "~alsa_input.usb-Logitech_A50.*"
            }
        ]
        actions = {
            update-props = {
                node.disabled = true
            }
        }
    }
]
