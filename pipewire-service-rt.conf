# Install as ~/.config/systemd/user/pipewire.service.d/rt.conf
# Then: systemctl --user daemon-reload && systemctl --user restart pipewire
#
# Starts PipeWire with SCHED_FIFO priority 88. Threads it creates — crucially
# data-loop.0, which runs the audio graph — inherit that policy.
#
# MUST BE PAIRED WITH rt-priority.conf (module.rt = false), or module-rt will
# demote data-loop.0 straight back to SCHED_OTHER.
#
# WHY NOT LET module-rt DO THIS (its actual job)?
# On Raspberry Pi OS Lite every route it has is broken:
#   * xdg-desktop-portal — not installed (no desktop)
#   * RTKit — clamps the requested 88 down to 20, and the grant does not stick
#     (rtkit-daemon keeps reporting "Supervising 0 threads"); once masked,
#     module-rt logs "RTKit does not give us MaxRealtimePriority, using 1"
#   * direct rlimits — module-rt never falls back to it once committed to RTKit,
#     so LimitRTPRIO=95 is never consulted
# Neither `module.rt.args` in context.properties NOR at top level overrides this —
# both are silently ignored. Loading a private copy of libpipewire-module-rt from
# conf.d loads too LATE (after the data-loop threads exist) to affect them.
#
# TRADE-OFF: this puts the MAIN thread at realtime priority too, not just the audio
# thread. Acceptable on a dedicated appliance, and
# /etc/systemd/system/user@.service.d/50-audio-limits.conf sets LimitRTTIME=200000
# so a runaway realtime thread gets SIGXCPU rather than wedging the Pi.
#
# VERIFY: ps -eLo pid,tid,cls,rtprio,comm | grep data-loop
#   want:  FF  88  data-loop.0   (under the `pipewire` PID)
[Service]
CPUSchedulingPolicy=fifo
CPUSchedulingPriority=88
