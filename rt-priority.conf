# Install as ~/.config/pipewire/pipewire.conf.d/rt-priority.conf
#
# Disables PipeWire's module-rt. Paired with
# ~/.config/systemd/user/pipewire.service.d/rt.conf, which starts PipeWire under
# SCHED_FIFO 88 via systemd so its threads INHERIT realtime scheduling.
#
# Without this file module-rt actively re-sets the data-loop thread's priority.
# Because none of its routes work on Raspberry Pi OS Lite it demotes the data-loop
# back to SCHED_OTHER, giving you the main thread at FF 88 and data-loop.0 at TS —
# realtime on the thread that doesn't matter, and not on the one that does.
#
# The stock module in /usr/share/pipewire/pipewire.conf carries
#     condition = [ { module.rt = !false } ]
# so setting module.rt = false is the supported way to stop it loading.
#
# VERIFY: ps -eLo pid,tid,cls,rtprio,comm | grep data-loop
#   want:  FF  88  data-loop.0
context.properties = {
    module.rt = false
}
